version: 2
title: B210 Spectrum
summary: B210 spectrum (generated by ce).
author: ""
license: MIT
description: SoapySDR source (UHD, B210) and spectrum analyzer.
graph:
  - name: soapy
    module: soapy
    device: cpu
    runtime: native
    provider: generic
    config:
      deviceString: 'driver=uhd,type=b200,fpga=/home/USER/uhd_images/usrp_b210_fpga_github.bin,num_recv_frames=1024'
      antenna: 'RX2'
      frequency: 94900000
      frequencyStep: 1000000
      sampleRate: 61440000
      automaticGain: true
      biasTee: false
      numberOfBatches: 16
      numberOfTimeSamples: 8192
      bufferMultiplier: 4
    meta:
      node: {x: 49, y: 94, width: 332, height: 0}
  - name: to_gpu
    module: duplicate
    device: cpu
    runtime: native
    provider: generic
    config:
      outputDevice: cuda
      hostAccessible: true
    input:
      buffer: '${graph.soapy.output.signal}'
    meta:
      node: {x: 400, y: 300, width: 200, height: 0}
  - name: spectrum_analyzer
    module: spectrum_analyzer
    device: cuda
    runtime: native
    provider: generic
    config:
      lineplotAveraging: 28
      waterfallAveraging: 4
      maxHold: false
      fill: true
      rangeMin: -100
      rangeMax: 0
      waterfallHeight: 1024
      splitRatio: 0.3037825
      xLabel: Frequency (MHz)
      amplitudeLabel: Amplitude (dBFS)
      waterfallLabel: Time
    input:
      buffer: '${graph.to_gpu.output.buffer}'
    meta:
      node: {x: 497, y: 95, width: 860, height: 0}
